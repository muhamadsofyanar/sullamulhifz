# @phase 4.2-4.4 Release traceability
name: Release Documentation Check

on:
  push:
  pull_request:

jobs:
  release-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release documentation
        run: sh scripts/check-release-docs.sh
      - name: Validate phase manifest
        run: python3 scripts/check-phase-manifest.py
