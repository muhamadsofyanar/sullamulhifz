# @phase 6.0 Free core release gate; @phase 6.1 transparent operations gate
name: Tests

on:
  push:
  pull_request:

jobs:
  php-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, intl
          coverage: none
      - run: cp .env.example .env
      - name: Require reproducible dependencies
        run: test -f composer.lock
      - run: composer validate --strict --no-check-publish
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer audit --locked --no-dev --no-interaction
      - run: php artisan key:generate --force
      - name: Bootstrap and route smoke test
        run: |
          sh -n scripts/container-start.sh
          grep -F 'RUN_RELEASE_TASKS:-false' scripts/container-start.sh
          grep -F 'MUSHAF_LINE_AUTO_SYNC:-false' scripts/container-start.sh
          grep -F 'QURAN_AUDIO_AUTO_SYNC:-false' scripts/container-start.sh
          grep -F 'migrate --isolated --force' scripts/container-start.sh
          php artisan package:discover --ansi
          php artisan route:list --no-ansi > /tmp/sullam-routes.txt
      - name: Compile and lint Blade views
        run: |
          php artisan view:cache
          for file in storage/framework/views/*.php; do php -l "$file" || exit 1; done
          php artisan view:clear
      - name: Run complete Laravel test suite
        run: |
          php artisan test
          php artisan sullam:verify-release-v610

  docker-build:
    runs-on: ubuntu-latest
    needs: php-tests
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image before Coolify
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sullamulhifz:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
